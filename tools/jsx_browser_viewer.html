<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSX Browser Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --text: #e6e6e6;
      --muted: #a7afbf;
      --border: #31384a;
      --accent: #5da9ff;
      --good: #7bd88f;
      --warn: #ffd166;
      --bad: #ff7b7b;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .top {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    button, .paste-btn {
      background: var(--accent);
      color: #08111f;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
    }
    input[type="file"] { display: none; }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      transition: 0.15s ease;
      user-select: none;
    }
    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(93,169,255,0.08);
      color: var(--text);
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      resize: vertical;
      box-sizing: border-box;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      max-height: 60vh;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      margin: 8px 0 12px;
    }
    .hidden { display: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: var(--panel);
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--panel-2);
      position: sticky;
      top: 0;
    }
    .table-wrap, .visual-wrap {
      overflow: auto;
      max-height: 70vh;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-sizing: border-box;
      background: var(--panel-2);
    }
    .status {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      margin-bottom: 12px;
      color: var(--muted);
    }
    .status.good { border-color: rgba(123,216,143,0.4); color: var(--good); }
    .status.warn { border-color: rgba(255,209,102,0.4); color: var(--warn); }
    .status.bad { border-color: rgba(255,123,123,0.4); color: var(--bad); }
    .render-shell {
      background: #fff;
      color: #111;
      border-radius: 10px;
      min-height: 120px;
      padding: 12px;
      box-sizing: border-box;
    }
    .toolbar {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .detected-table-section {
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
    }
    .detected-table-header {
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }
    .chip {
      display: inline-block;
      margin-left: 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 style="margin-top:0;">JSX Browser Viewer</h1>
      <div class="top">
        <label for="fileInput" class="paste-btn">Select .jsx file</label>
        <input id="fileInput" type="file" accept=".jsx,.js,.txt" />
        <button id="pasteClipboardBtn" type="button">Paste from clipboard</button>
      </div>
      <div id="dropzone" class="dropzone" style="margin-top:12px;">
        Drag and drop a .jsx file here
      </div>
      <div style="margin-top:12px;">
        <textarea id="pasteArea" placeholder="Or copy-paste JSX content here"></textarea>
        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
          <button id="showPastedBtn" type="button">Show pasted content</button>
          <button id="clearBtn" type="button">Clear</button>
        </div>
      </div>
    </div>

    <div id="previewCard" class="card hidden">
      <h2 style="margin-top:0;">Preview</h2>
      <div id="meta" class="meta"></div>
      <div class="toolbar">
        <button id="rawViewBtn" type="button">Raw JSX</button>
        <button id="tableViewBtn" type="button">Detected tables</button>
        <button id="visualViewBtn" type="button">Visual render</button>
      </div>

      <div id="rawView">
        <pre id="output"></pre>
      </div>

      <div id="tableView" class="hidden">
        <div id="tableInfo" class="meta"></div>
        <div id="tableWrap" class="table-wrap"></div>
      </div>

      <div id="visualView" class="hidden">
        <div id="visualStatus" class="status warn">Visual render has not been attempted yet.</div>
        <div id="visualWrap" class="visual-wrap">
          <div id="reactMount" class="render-shell"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const pasteArea = document.getElementById('pasteArea');
    const showPastedBtn = document.getElementById('showPastedBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pasteClipboardBtn = document.getElementById('pasteClipboardBtn');
    const previewCard = document.getElementById('previewCard');
    const output = document.getElementById('output');
    const meta = document.getElementById('meta');
    const rawView = document.getElementById('rawView');
    const tableView = document.getElementById('tableView');
    const visualView = document.getElementById('visualView');
    const rawViewBtn = document.getElementById('rawViewBtn');
    const tableViewBtn = document.getElementById('tableViewBtn');
    const visualViewBtn = document.getElementById('visualViewBtn');
    const tableWrap = document.getElementById('tableWrap');
    const tableInfo = document.getElementById('tableInfo');
    const visualStatus = document.getElementById('visualStatus');
    const reactMount = document.getElementById('reactMount');

    let currentSource = '';
    let reactRoot = null;
    let lastDetectedTables = [];

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function setView(mode) {
      rawView.classList.toggle('hidden', mode !== 'raw');
      tableView.classList.toggle('hidden', mode !== 'table');
      visualView.classList.toggle('hidden', mode !== 'visual');
    }

    rawViewBtn.addEventListener('click', () => setView('raw'));
    tableViewBtn.addEventListener('click', () => setView('table'));
    visualViewBtn.addEventListener('click', async () => {
      setView('visual');
      await renderVisual(currentSource);
    });

    function setVisualStatus(type, text) {
      visualStatus.className = 'status ' + type;
      visualStatus.textContent = text;
    }

    function cleanupReactRender() {
      try {
        if (reactRoot) {
          reactRoot.unmount();
          reactRoot = null;
        }
      } catch (error) {}
      reactMount.innerHTML = '';
    }

    function extractBracketed(source, startIndex, openChar, closeChar) {
      let depth = 0;
      let inString = false;
      let stringChar = '';
      let escaped = false;
      let inLineComment = false;
      let inBlockComment = false;

      for (let i = startIndex; i < source.length; i++) {
        const ch = source[i];
        const next = source[i + 1];

        if (inLineComment) {
          if (ch === '\n') inLineComment = false;
          continue;
        }

        if (inBlockComment) {
          if (ch === '*' && next === '/') {
            inBlockComment = false;
            i++;
          }
          continue;
        }

        if (inString) {
          if (escaped) {
            escaped = false;
          } else if (ch === '\\') {
            escaped = true;
          } else if (stringChar !== '`' && ch === stringChar) {
            inString = false;
          } else if (stringChar === '`' && ch === '`') {
            inString = false;
          }
          continue;
        }

        if (ch === '/' && next === '/') {
          inLineComment = true;
          i++;
          continue;
        }
        if (ch === '/' && next === '*') {
          inBlockComment = true;
          i++;
          continue;
        }

        if (ch === '"' || ch === "'" || ch === '`') {
          inString = true;
          stringChar = ch;
          continue;
        }

        if (ch === openChar) depth++;
        if (ch === closeChar) {
          depth--;
          if (depth === 0) return source.slice(startIndex, i + 1);
        }
      }

      return null;
    }

    function extractNamedArrayLiterals(source) {
      const arrays = [];
      const re = /\b(?:const|let|var)\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*=\s*\[/g;
      let match;
      while ((match = re.exec(source))) {
        const name = match[1];
        const startIndex = source.indexOf('[', match.index);
        const literal = extractBracketed(source, startIndex, '[', ']');
        if (literal) arrays.push({ name, literal });
      }
      return arrays;
    }

    function safeEvalArrayLiteral(text) {
      return Function('"use strict"; return (' + text + ');')();
    }

    function isArrayOfObjects(value) {
      return Array.isArray(value) && value.length > 0 && value.every(item => item && typeof item === 'object' && !Array.isArray(item));
    }

    function extractTables(source) {
      const arrays = extractNamedArrayLiterals(source);
      const tables = [];
      for (const item of arrays) {
        try {
          const value = safeEvalArrayLiteral(item.literal);
          if (isArrayOfObjects(value)) {
            const columnSet = new Set();
            value.forEach(row => Object.keys(row || {}).forEach(key => columnSet.add(key)));
            tables.push({
              name: item.name,
              rows: value,
              columns: Array.from(columnSet)
            });
          }
        } catch (error) {}
      }
      return tables;
    }

    function renderTableSections(container, tables) {
      container.innerHTML = '';
      if (!tables.length) return;

      for (const tableData of tables) {
        const section = document.createElement('div');
        section.className = 'detected-table-section';

        const header = document.createElement('div');
        header.className = 'detected-table-header';
        header.innerHTML = escapeHtml(tableData.name) + '<span class="chip">' + tableData.rows.length + ' rows • ' + tableData.columns.length + ' columns</span>';
        section.appendChild(header);

        const innerWrap = document.createElement('div');
        innerWrap.style.overflow = 'auto';

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        tableData.columns.forEach(col => {
          const th = document.createElement('th');
          th.textContent = col;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        tableData.rows.forEach(row => {
          const tr = document.createElement('tr');
          tableData.columns.forEach(col => {
            const td = document.createElement('td');
            const value = row[col];
            td.textContent = value == null ? '—' : String(value);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        innerWrap.appendChild(table);
        section.appendChild(innerWrap);
        container.appendChild(section);
      }
    }

    function tryBuildTable(source) {
      lastDetectedTables = extractTables(source);
      tableWrap.innerHTML = '';

      if (!lastDetectedTables.length) {
        tableInfo.textContent = 'No object-array tables were detected.';
        tableViewBtn.disabled = true;
        return;
      }

      tableViewBtn.disabled = false;
      renderTableSections(tableWrap, lastDetectedTables);
      const totalRows = lastDetectedTables.reduce((sum, t) => sum + t.rows.length, 0);
      tableInfo.textContent = 'Detected ' + lastDetectedTables.length + ' table(s), total ' + totalRows + ' row(s).';
    }

    function normalizeSourceForRuntime(source) {
      let cleaned = source;
      cleaned = cleaned.replace(/^\s*import\s+React[^;]*;\s*$/gm, '');
      cleaned = cleaned.replace(/^\s*import\s+[\s\S]*?\s+from\s+["'][^"']+["'];?\s*$/gm, '');
      cleaned = cleaned.replace(/^\s*export\s+default\s+function\s+([A-Za-z0-9_]+)\s*\(/m, 'function $1(');
      cleaned = cleaned.replace(/^\s*export\s+default\s+class\s+([A-Za-z0-9_]+)\s*/m, 'class $1 ');
      cleaned = cleaned.replace(/^\s*export\s+default\s+([A-Za-z0-9_]+)\s*;?\s*$/m, 'window.__JSXViewerComponent = $1;');
      cleaned = cleaned.replace(/^\s*export\s+default\s+/m, 'window.__JSXViewerComponent = ');
      return cleaned;
    }

    function getRuntimePreamble() {
      return `
        const React = window.React;
        const useState = React.useState;
        const useMemo = React.useMemo;
        const useEffect = React.useEffect;
        const useRef = React.useRef;

        function __jsxStub(tagName, extraStyle) {
          return function(props) {
            const children = props && props.children;
            const nextProps = Object.assign({}, props || {});
            delete nextProps.children;
            nextProps.style = Object.assign({}, extraStyle || {}, nextProps.style || {});
            return React.createElement(tagName, nextProps, children);
          }
        }

        const Card = __jsxStub('div', { border: '1px solid #d0d7de', borderRadius: '12px', padding: '12px', marginBottom: '12px', background: '#fff' });
        const CardHeader = __jsxStub('div', { marginBottom: '8px' });
        const CardContent = __jsxStub('div', {});
        const CardTitle = __jsxStub('h3', { margin: '0 0 8px 0' });
        const Input = function(props) { return React.createElement('input', Object.assign({ style: { padding: '8px', border: '1px solid #ccc', borderRadius: '8px' } }, props || {})); };
        const Button = function(props) {
          const nextProps = Object.assign({}, props || {});
          nextProps.style = Object.assign({ padding: '8px 12px', border: '1px solid #ccc', borderRadius: '8px', background: '#f3f4f6', cursor: 'pointer' }, nextProps.style || {});
          return React.createElement('button', nextProps, nextProps.children);
        };
        const Badge = __jsxStub('span', { display: 'inline-block', padding: '2px 8px', borderRadius: '999px', background: '#eef2ff', border: '1px solid #c7d2fe', fontSize: '12px', marginRight: '6px' });
        const ChevronUp = __jsxStub('span', { display: 'inline-block' });
        const ChevronDown = __jsxStub('span', { display: 'inline-block' });
        const ChevronsUpDown = __jsxStub('span', { display: 'inline-block' });
        const X = __jsxStub('span', { display: 'inline-block' });
      `;
    }

    function buildRuntimeCode(source) {
      const cleaned = normalizeSourceForRuntime(source);
      return [
        '(function(){',
        getRuntimePreamble(),
        cleaned,
        'if (!window.__JSXViewerComponent) {',
        "  if (typeof SimpleJsxFileViewer !== 'undefined') window.__JSXViewerComponent = SimpleJsxFileViewer;",
        "  else if (typeof App !== 'undefined') window.__JSXViewerComponent = App;",
        '}',
        '})();'
      ].join('\n');
    }

    function renderFallbackTablesIntoVisual() {
      cleanupReactRender();
      reactMount.innerHTML = '';
      if (!lastDetectedTables.length) {
        reactMount.innerHTML = '<div style="padding:12px;">No visual tables could be built from this file.</div>';
        return false;
      }
      renderTableSections(reactMount, lastDetectedTables);
      return true;
    }

    async function renderVisual(source) {
      cleanupReactRender();

      if (!source || !source.trim()) {
        visualViewBtn.disabled = true;
        setVisualStatus('bad', 'No JSX content loaded.');
        return;
      }

      if (!window.React || !window.ReactDOM || !window.Babel) {
        const ok = renderFallbackTablesIntoVisual();
        setVisualStatus(ok ? 'warn' : 'bad', ok ? 'Visual JSX render is unavailable offline, so detected tables are shown instead.' : 'React/Babel libraries are not available.');
        return;
      }

      try {
        setVisualStatus('warn', 'Trying to render the JSX component visually...');
        window.__JSXViewerComponent = null;

        const runtimeCode = buildRuntimeCode(source);
        const transpiled = window.Babel.transform(runtimeCode, { presets: ['react'] }).code;
        const script = document.createElement('script');
        script.text = transpiled;
        document.body.appendChild(script);
        script.remove();

        const Component = window.__JSXViewerComponent;
        if (typeof Component !== 'function') {
          const ok = renderFallbackTablesIntoVisual();
          setVisualStatus(ok ? 'warn' : 'bad', ok ? 'No standalone React component was found, so detected tables are shown visually instead.' : 'Visual render failed: no renderable React component was found.');
          return;
        }

        reactRoot = window.ReactDOM.createRoot(reactMount);
        reactRoot.render(window.React.createElement(Component));
        setVisualStatus('good', 'Visual render succeeded.');
      } catch (error) {
        console.error(error);
        const ok = renderFallbackTablesIntoVisual();
        const message = error && error.message ? error.message : 'Unknown error';
        setVisualStatus(ok ? 'warn' : 'bad', ok ? 'Exact JSX render failed, so detected tables are shown instead. Error: ' + message : 'Visual render failed: ' + message);
      }
    }

    function showContent(text, label) {
      currentSource = text;
      previewCard.classList.remove('hidden');
      output.innerHTML = escapeHtml(text);
      meta.textContent = label;
      tryBuildTable(text);
      visualViewBtn.disabled = false;
      cleanupReactRender();
      setVisualStatus('warn', 'Click “Visual render” to try rendering the JSX component itself. If that fails, detected tables will be shown visually.');
      setView('raw');
    }


    async function autoLoadFromQuery() {
      try {
        const url = new URL(window.location.href);
        const fileName = url.searchParams.get('file');
        if (!fileName) return;

        const response = await fetch(fileName, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Could not load ${fileName} (${response.status})`);
        }

        const text = await response.text();
        showContent(text, `${fileName} • auto-loaded`);

        const preferredView = (url.searchParams.get('view') || 'visual').toLowerCase();
        if (preferredView === 'table') {
          setView('table');
        } else if (preferredView === 'raw') {
          setView('raw');
        } else {
          setView('visual');
          await renderVisual(text);
        }
      } catch (error) {
        console.error(error);
        previewCard.classList.remove('hidden');
        meta.textContent = 'Automatic file load failed';
        output.textContent = error && error.message ? error.message : 'Unknown auto-load error';
        setView('raw');
      }
    }

    function readFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        showContent(String(reader.result), `${file.name} • ${file.size} bytes`);
      };
      reader.readAsText(file);
    }

    fileInput.addEventListener('change', (event) => {
      readFile(event.target.files[0]);
    });

    dropzone.addEventListener('dragover', (event) => {
      event.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (event) => {
      event.preventDefault();
      dropzone.classList.remove('dragover');
      const file = event.dataTransfer.files[0];
      readFile(file);
    });

    showPastedBtn.addEventListener('click', () => {
      const text = pasteArea.value.trim();
      if (!text) return;
      showContent(text, 'Pasted JSX content');
    });

    pasteClipboardBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text.trim()) return;
        pasteArea.value = text;
        showContent(text, 'Clipboard JSX content');
      } catch (error) {
        alert('Clipboard access was blocked by the browser. Paste into the text box instead.');
      }
    });


    window.addEventListener('DOMContentLoaded', () => {
      autoLoadFromQuery();
    });

    clearBtn.addEventListener('click', () => {
      fileInput.value = '';
      pasteArea.value = '';
      currentSource = '';
      output.textContent = '';
      meta.textContent = '';
      tableWrap.innerHTML = '';
      tableInfo.textContent = '';
      lastDetectedTables = [];
      cleanupReactRender();
      setVisualStatus('warn', 'Visual render has not been attempted yet.');
      previewCard.classList.add('hidden');
      tableViewBtn.disabled = false;
      visualViewBtn.disabled = false;
    });
  </script>
</body>
</html>
