<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSX Browser Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --text: #e6e6e6;
      --muted: #a7afbf;
      --border: #31384a;
      --accent: #5da9ff;
      --good: #7bd88f;
      --warn: #ffd166;
      --bad: #ff7b7b;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .top {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    button, .paste-btn {
      background: var(--accent);
      color: #08111f;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
    }
    input[type="file"] { display: none; }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      transition: 0.15s ease;
      user-select: none;
    }
    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(93,169,255,0.08);
      color: var(--text);
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      resize: vertical;
      box-sizing: border-box;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      max-height: 60vh;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      margin: 8px 0 12px;
    }
    .hidden { display: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: var(--panel);
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--panel-2);
      position: sticky;
      top: 0;
    }
    .table-wrap, .visual-wrap {
      overflow: auto;
      max-height: 65vh;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-sizing: border-box;
      background: var(--panel-2);
    }
    .status {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      margin-bottom: 12px;
      color: var(--muted);
    }
    .status.good { border-color: rgba(123,216,143,0.4); color: var(--good); }
    .status.warn { border-color: rgba(255,209,102,0.4); color: var(--warn); }
    .status.bad { border-color: rgba(255,123,123,0.4); color: var(--bad); }
    .render-shell {
      background: #fff;
      color: #111;
      border-radius: 10px;
      min-height: 120px;
      padding: 12px;
      box-sizing: border-box;
    }
    .toolbar {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 style="margin-top:0;">JSX Browser Viewer</h1>
      <div class="top">
        <label for="fileInput" class="paste-btn">Select .jsx file</label>
        <input id="fileInput" type="file" accept=".jsx,.js,.txt" />
        <button id="pasteClipboardBtn" type="button">Paste from clipboard</button>
      </div>
      <div id="dropzone" class="dropzone" style="margin-top:12px;">
        Drag and drop a .jsx file here
      </div>
      <div style="margin-top:12px;">
        <textarea id="pasteArea" placeholder="Or copy-paste JSX content here"></textarea>
        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
          <button id="showPastedBtn" type="button">Show pasted content</button>
          <button id="clearBtn" type="button">Clear</button>
        </div>
      </div>
    </div>

    <div id="previewCard" class="card hidden">
      <h2 style="margin-top:0;">Preview</h2>
      <div id="meta" class="meta"></div>
      <div class="toolbar">
        <button id="rawViewBtn" type="button">Raw JSX</button>
        <button id="tableViewBtn" type="button">Detected rows table</button>
        <button id="visualViewBtn" type="button">Visual render</button>
      </div>

      <div id="rawView">
        <pre id="output"></pre>
      </div>

      <div id="tableView" class="hidden">
        <div id="tableInfo" class="meta"></div>
        <div id="tableWrap" class="table-wrap"></div>
      </div>

      <div id="visualView" class="hidden">
        <div id="visualStatus" class="status warn">Visual render has not been attempted yet.</div>
        <div id="visualWrap" class="visual-wrap">
          <div id="reactMount" class="render-shell"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const pasteArea = document.getElementById('pasteArea');
    const showPastedBtn = document.getElementById('showPastedBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pasteClipboardBtn = document.getElementById('pasteClipboardBtn');
    const previewCard = document.getElementById('previewCard');
    const output = document.getElementById('output');
    const meta = document.getElementById('meta');
    const rawView = document.getElementById('rawView');
    const tableView = document.getElementById('tableView');
    const visualView = document.getElementById('visualView');
    const rawViewBtn = document.getElementById('rawViewBtn');
    const tableViewBtn = document.getElementById('tableViewBtn');
    const visualViewBtn = document.getElementById('visualViewBtn');
    const tableWrap = document.getElementById('tableWrap');
    const tableInfo = document.getElementById('tableInfo');
    const visualStatus = document.getElementById('visualStatus');
    const reactMount = document.getElementById('reactMount');

    let currentSource = '';
    let reactRoot = null;

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function setView(mode) {
      rawView.classList.toggle('hidden', mode !== 'raw');
      tableView.classList.toggle('hidden', mode !== 'table');
      visualView.classList.toggle('hidden', mode !== 'visual');
    }

    rawViewBtn.addEventListener('click', () => setView('raw'));
    tableViewBtn.addEventListener('click', () => setView('table'));
    visualViewBtn.addEventListener('click', async () => {
      setView('visual');
      await renderVisual(currentSource);
    });

    function setVisualStatus(type, text) {
      visualStatus.className = 'status ' + type;
      visualStatus.textContent = text;
    }

    function cleanupReactRender() {
      try {
        if (reactRoot) {
          reactRoot.unmount();
          reactRoot = null;
        }
      } catch (error) {}
      reactMount.innerHTML = '';
    }

    function extractRowsArray(source) {
      const startMatch = source.match(/\b(?:const|let|var)\s+rows\s*=\s*\[/);
      if (!startMatch) return null;
      const startIndex = startMatch.index + startMatch[0].length - 1;
      let depth = 0;
      let inString = false;
      let stringChar = '';
      let escaped = false;

      for (let i = startIndex; i < source.length; i++) {
        const ch = source[i];

        if (inString) {
          if (escaped) {
            escaped = false;
          } else if (ch === '\\') {
            escaped = true;
          } else if (ch === stringChar) {
            inString = false;
          }
          continue;
        }

        if (ch === '"' || ch === "'" || ch === '`') {
          inString = true;
          stringChar = ch;
          continue;
        }

        if (ch === '[') depth++;
        if (ch === ']') {
          depth--;
          if (depth === 0) {
            return source.slice(startIndex, i + 1);
          }
        }
      }

      return null;
    }

    function tryBuildTable(source) {
      tableWrap.innerHTML = '';
      tableInfo.textContent = 'No rows array detected.';
      tableViewBtn.disabled = false;

      const arrayText = extractRowsArray(source);
      if (!arrayText) {
        tableViewBtn.disabled = true;
        return;
      }

      try {
        const rows = Function('return (' + arrayText + ');')();
        if (!Array.isArray(rows) || rows.length === 0 || typeof rows[0] !== 'object') {
          tableViewBtn.disabled = true;
          tableInfo.textContent = 'Rows array found, but it could not be shown as a table.';
          return;
        }

        const columnSet = new Set();
        rows.forEach(row => Object.keys(row || {}).forEach(key => columnSet.add(key)));
        const columns = Array.from(columnSet);

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        columns.forEach(col => {
          const th = document.createElement('th');
          th.textContent = col;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        rows.forEach(row => {
          const tr = document.createElement('tr');
          columns.forEach(col => {
            const td = document.createElement('td');
            const value = row[col];
            td.textContent = value == null ? '—' : String(value);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        tableInfo.textContent = `Detected rows table: ${rows.length} rows, ${columns.length} columns.`;
      } catch (error) {
        tableViewBtn.disabled = true;
        tableInfo.textContent = 'Rows array was detected, but parsing failed.';
      }
    }

    function normalizeSourceForRuntime(source) {
      return source
        .replace(/^\s*import\s+[^;]+;\s*$/gm, '')
        .replace(/^\s*export\s+default\s+function\s+([A-Za-z0-9_]+)\s*\(/m, 'function $1(')
        .replace(/^\s*export\s+default\s+([A-Za-z0-9_]+)\s*;?\s*$/m, 'window.__JSXViewerComponent = $1;')
        .replace(/^\s*export\s+default\s+/m, 'window.__JSXViewerComponent = ');
    }

    async function renderVisual(source) {
      cleanupReactRender();

      if (!source || !source.trim()) {
        visualViewBtn.disabled = true;
        setVisualStatus('bad', 'No JSX content loaded.');
        return;
      }

      if (!window.React || !window.ReactDOM || !window.Babel) {
        setVisualStatus('bad', 'React/Babel libraries are not available. Internet access is needed for visual JSX rendering.');
        return;
      }

      try {
        setVisualStatus('warn', 'Trying to render the JSX component visually...');
        window.__JSXViewerComponent = null;

        const cleaned = normalizeSourceForRuntime(source);
        const wrapped = `
          (function(){
            const React = window.React;
            ${cleaned}
            if (!window.__JSXViewerComponent) {
              if (typeof SimpleJsxFileViewer !== 'undefined') window.__JSXViewerComponent = SimpleJsxFileViewer;
              else if (typeof App !== 'undefined') window.__JSXViewerComponent = App;
              else if (typeof defaultExport !== 'undefined') window.__JSXViewerComponent = defaultExport;
            }
          })();
        `;

        const transpiled = window.Babel.transform(wrapped, {
          presets: ['react']
        }).code;

        const script = document.createElement('script');
        script.text = transpiled;
        document.body.appendChild(script);
        script.remove();

        const Component = window.__JSXViewerComponent;
        if (typeof Component !== 'function') {
          setVisualStatus('bad', 'Visual render failed: no renderable React component was found.');
          return;
        }

        reactRoot = window.ReactDOM.createRoot(reactMount);
        reactRoot.render(window.React.createElement(Component));
        setVisualStatus('good', 'Visual render succeeded. If the JSX contains a table component, it should now be visible below.');
      } catch (error) {
        console.error(error);
        setVisualStatus('bad', 'Visual render failed: ' + (error && error.message ? error.message : 'Unknown error'));
      }
    }

    function showContent(text, label) {
      currentSource = text;
      previewCard.classList.remove('hidden');
      output.innerHTML = escapeHtml(text);
      meta.textContent = label;
      tryBuildTable(text);
      visualViewBtn.disabled = false;
      cleanupReactRender();
      setVisualStatus('warn', 'Click “Visual render” to try rendering the JSX component itself.');
      setView('raw');
    }

    function readFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        showContent(String(reader.result), `${file.name} • ${file.size} bytes`);
      };
      reader.readAsText(file);
    }

    fileInput.addEventListener('change', (event) => {
      readFile(event.target.files[0]);
    });

    dropzone.addEventListener('dragover', (event) => {
      event.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (event) => {
      event.preventDefault();
      dropzone.classList.remove('dragover');
      const file = event.dataTransfer.files[0];
      readFile(file);
    });

    showPastedBtn.addEventListener('click', () => {
      const text = pasteArea.value.trim();
      if (!text) return;
      showContent(text, 'Pasted JSX content');
    });

    pasteClipboardBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text.trim()) return;
        pasteArea.value = text;
        showContent(text, 'Clipboard JSX content');
      } catch (error) {
        alert('Clipboard access was blocked by the browser. Paste into the text box instead.');
      }
    });

    clearBtn.addEventListener('click', () => {
      fileInput.value = '';
      pasteArea.value = '';
      currentSource = '';
      output.textContent = '';
      meta.textContent = '';
      tableWrap.innerHTML = '';
      tableInfo.textContent = '';
      cleanupReactRender();
      setVisualStatus('warn', 'Visual render has not been attempted yet.');
      previewCard.classList.add('hidden');
      tableViewBtn.disabled = false;
      visualViewBtn.disabled = false;
    });
  </script>
</body>
</html>
